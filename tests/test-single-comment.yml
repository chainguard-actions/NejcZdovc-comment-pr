name: Test single comment mode with identifier
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "This is a single comment test."
          single_comment: "true"
          identifier: "MY_CUSTOM_IDENTIFIER"
          github_token: ${{ github.token }}

      - name: Assert action ran with single_comment mode or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COMMENTED: ${{ steps.action.outputs.commented }}
        run: |
          echo "outcome: $OUTCOME"
          echo "commented: $COMMENTED"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$COMMENTED" ]; then
              echo "FAIL: action succeeded but 'commented' output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with commented=$COMMENTED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or non-PR context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
