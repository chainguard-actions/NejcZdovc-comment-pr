name: Test file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create comment file
        run: |
          echo "# Test Comment from File" > /tmp/comment.md
          echo "This is a test comment generated from a file." >> /tmp/comment.md
      - id: action
        uses: .
        with:
          file: /tmp/comment.md
          github_token: ${{ github.token }}
          single_comment: "false"
          identifier: "TEST_COMMENT_FILE"
        continue-on-error: true
      - name: Assert output exists
        env:
          COMMENTED: ${{ steps.action.outputs.commented }}
        run: |
          echo "commented: $COMMENTED"
          if [ -z "$COMMENTED" ] && [ "${{ steps.action.outcome }}" != "success" ]; then
            echo "Action did not produce output and failed unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with file input and handled gracefully"
