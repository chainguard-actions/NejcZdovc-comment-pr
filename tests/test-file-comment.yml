name: Test file-based comment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create comment markdown file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/comment.md" <<'EOF'
          ## Test Comment

          This comment was generated from a markdown file.

          - Item 1
          - Item 2
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          file: "tests/fixtures/comment.md"
          single_comment: "false"
          github_token: ${{ github.token }}

      - name: Assert action ran with file input or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COMMENTED: ${{ steps.action.outputs.commented }}
        run: |
          echo "outcome: $OUTCOME"
          echo "commented: $COMMENTED"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$COMMENTED" ]; then
              echo "FAIL: action succeeded but 'commented' output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with commented=$COMMENTED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or non-PR context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
