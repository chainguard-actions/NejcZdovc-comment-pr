name: Test basic message comment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          message: "Hello from the test!"
          github_token: ${{ github.token }}

      - name: Assert action ran (commented output set, or failed gracefully on sentinel repo)
        env:
          COMMENTED: ${{ steps.action.outputs.commented }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "commented: $COMMENTED"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$COMMENTED" ]; then
              echo "FAIL: action succeeded but 'commented' output is empty"
              exit 1
            fi
            echo "PASS: commented=$COMMENTED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable or not a PR context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
