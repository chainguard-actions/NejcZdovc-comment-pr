name: Test basic message input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          message: "Hello from test!"
          github_token: ${{ github.token }}
          single_comment: "true"
          identifier: "TEST_COMMENT_BASIC"
        continue-on-error: true
      - name: Assert output exists
        env:
          COMMENTED: ${{ steps.action.outputs.commented }}
        run: |
          echo "commented: $COMMENTED"
          if [ -z "$COMMENTED" ] && [ "${{ steps.action.outcome }}" != "success" ]; then
            echo "Action did not produce output and failed unexpectedly"
            exit 1
          fi
          echo "PASS: action ran and produced output or handled gracefully"
