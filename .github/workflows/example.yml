name: Example

on:
  pull_request:

permissions:
  pull-requests: write

jobs:
  body:
    name: Doing comment with message
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

    - name: Get time
      uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
      id: get-time
      with:
        script: return new Date().toString()
        result-encoding: string

    - name: Comment
      uses: ./
      with:
        message: >
          Hello world :wave:!
          ${{steps.get-time.outputs.result}}
        identifier: 'GITHUB_COMMIT_BODY'
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  file:
    name: Doing comment with file
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

    - name: Get time
      uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
      id: get-time
      with:
        script: return new Date().toString()
        result-encoding: string

    - name: Comment
      uses: ./
      with:
        file: 'comment.md'
        identifier: 'GITHUB_COMMIT_FILE'
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        DATE: ${{steps.get-time.outputs.result}}
